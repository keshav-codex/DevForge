{% extends "public/base.html" %}

{% block title %}
    Login | DevForge
{% endblock %}

{% block auth_content %}

<h1 class="auth-title">
    Welcome back
</h1>

<p class="auth-description">
    Sign in to continue to your DevForge workspace.
</p>

<form method="post"
      action="{% url 'account_login' %}"
      class="auth-form">

    {% csrf_token %}

    {{ form.as_p }}

    {% if redirect_field_value %}

        <input
            type="hidden"
            name="{{ redirect_field_name }}"
            value="{{ redirect_field_value }}"
        >

    {% endif %}

    <button type="submit"
            class="auth-button">
        Sign In
    </button>

</form>

<div class="auth-links">

    <a href="{% url 'account_signup' %}">
        Create an account
    </a>

    <a href="{% url 'account_reset_password' %}">
        Forgot password?
    </a>

</div>

{% endblock %}

{% extends "account/base.html" %}

{% block title %}
Logout | DevForge
{% endblock %}

{% block auth_content %}

<h1>Sign Out</h1>

<p class="auth-description">
    Are you sure you want to sign out?
</p>

<form method="post" action="{% url 'account_logout' %}">

    {% csrf_token %}

    <button type="submit" class="auth-button">
        Sign Out
    </button>

</form>

{% endblock %}

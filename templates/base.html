{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}DevForge{% endblock %}
    </title>

    <link rel="stylesheet"
          href="{% static 'css/base.css' %}">

    
    <link rel="stylesheet"
          href="{% static 'css/navigation.css' %}">

    <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    {% block extra_css %}
    {% endblock %}

</head>

<body>

    {% block navigation %}
    {% endblock %}

    {% block content %}
    {% endblock %}

    {% include "components/footer.html" %}

    {% block extra_js %}
        {% load static %}
        <script src="{% static 'js/base.js' %}"></script>
    {% endblock %}

</body>

</html>

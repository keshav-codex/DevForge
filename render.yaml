services:
  - type: web
    name: devforge
    runtime: python

    # Build and start commands.
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"

    # Production environment variables.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devforge-db
          property: connectionString

      - key: DEBUG
        value: "False"

      # Replace this after Render gives you the actual domain.
      - key: ALLOWED_HOSTS
        value: "devforge.onrender.com"

      # Replace this with the actual Render HTTPS domain if different.
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://devforge.onrender.com"

databases:
  - name: devforge-db